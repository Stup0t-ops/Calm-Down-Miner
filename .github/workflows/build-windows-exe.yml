name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name CalmDownMiner calm_down_miner.py

      - name: Copy default data files
        shell: pwsh
        run: |
          Copy-Item prices.json dist/CalmDownMiner/prices.json -Force
          Copy-Item settings.json dist/CalmDownMiner/settings.json -Force
          Copy-Item profile_index_cache.json dist/CalmDownMiner/profile_index_cache.json -Force

      - name: Create zip package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/CalmDownMiner/* -DestinationPath CalmDownMiner-Windows.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CalmDownMiner-Windows
          path: CalmDownMiner-Windows.zip

      - name: Attach zip to GitHub release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: CalmDownMiner-Windows.zip